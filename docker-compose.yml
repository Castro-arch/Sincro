services:
  postgres:
    image: postgres:16-alpine
    container_name: sincro-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-sincro}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-sincro}
      POSTGRES_DB: ${DB_NAME:-sincro}
    ports:
      - '${DB_PORT:-5432}:5432'
    volumes:
      - sincro-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER:-sincro} -d ${DB_NAME:-sincro}']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: sincro-redis
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - sincro-redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  sincro-pgdata:
  sincro-redisdata:
